name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            target: bun-linux-x64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: bun-darwin-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: ./bun install

      - name: Build binary
        run: |
          ./bun run scripts/build.ts \
            --minify --sourcemap \
            --target=${{ matrix.target }} \
            --outfile=gitrac-${{ matrix.os }}-${{ matrix.arch }}

      # The web UI is embedded, so the binary is self-contained. Release assets
      # are the raw binaries (install.sh and the npm packages chmod +x them).
      - name: Smoke test binary
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: ./gitrac-${{ matrix.os }}-${{ matrix.arch }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gitrac-${{ matrix.os }}-${{ matrix.arch }}
          path: gitrac-${{ matrix.os }}-${{ matrix.arch }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./binaries
          merge-multiple: true

      - name: List binaries
        run: ls -la ./binaries

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: ./binaries/*
          generate_release_notes: true
          # v1.2.0-rc.1 etc. are prereleases, so releases/latest (used by
          # install.sh) keeps pointing at the newest stable version
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./binaries
          merge-multiple: true

      - name: List binaries
        run: ls -la ./binaries

      # Authenticates via npm trusted publishing (OIDC) — no token needed.
      # One-time setup per package: see docs/releasing.md.
      - name: Publish to npm
        run: |
          ./bun scripts/npm/publish.ts \
            --version "${GITHUB_REF_NAME#v}" \
            --binaries-dir ./binaries
