version: 1
nextId: 11
statuses:
  - backlog
  - todo
  - in_progress
  - done
  - cancelled
labels:
  - bug
  - feature
  - enhancement
  - docs
  - chore
  - foo
labelColors:
  bug: '#e05d5d'
  feature: '#58a6e0'
  enhancement: '#4dba6f'
  docs: '#d4a843'
  chore: '#b065d6'
  foo: '#e07843'
priorities:
  - urgent
  - high
  - medium
  - low
  - none
defaultStatus: backlog
defaultPriority: medium
git:
  autoCommit: true
  autoPush: false
  commitPrefix: 'issue:'
  defaultBranch: main
